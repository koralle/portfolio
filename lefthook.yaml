pre-commit:
  parallel: true
  jobs:
    - name: Format with Prettier
      # Keep in sync with CI (`pnpm prettier . --check`): format any staged
      # Prettier-supported file, including Markdown docs under docs/.
      glob:
        - '*.ts'
        - '*.mts'
        - '*.mjs'
        - '*.cjs'
        - '*.astro'
        - '*.css'
        - '*.md'
        - '*.mdx'
        - '*.json'
        - '*.jsonc'
        - '*.yaml'
        - '*.yml'
        - '*.html'
      run: |
        pnpm prettier {staged_files} --write --config prettier.config.ts --ignore-unknown
      stage_fixed: true

    - name: Lint with ESLint
      glob:
        - 'src/**/*.ts'
        - 'src/**/*.astro'
        - 'prettier.config.ts'
        - 'panda.config.ts'
        - 'eslint.config.ts'
        - 'astro.config.mts'
        - 'postcss.config.cjs'
        - 'src/**/*.css'
        - 'package.json'
        - 'tsconfig.json'
        - 'wrangler.jsonc'
      run: |
        pnpm eslint {staged_files} --fix --config eslint.config.ts
      stage_fixed: true

    - name: Typecheck with Astro (app)
      glob:
        - 'src/**/*.ts'
        - 'src/**/*.astro'
        - 'astro.config.mts'
        - 'worker-configuration.d.ts'
        - 'package.json'
        - 'pnpm-lock.yaml'
      run: |
        pnpm astro check
