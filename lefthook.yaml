pre-commit:
  parallel: true
  jobs:
    - name: Format with Prettier
      glob:
        - '*.ts'
        - '*.mts'
        - '*.mjs'
        - '*.cjs'
        - '*.astro'
        - 'lefthook.yaml'
        - '*.json'
        - '*.jsonc'
      run: |
        pnpm prettier {staged_files} --write --config prettier.config.ts
      stage_fixed: true

    - name: Lint with ESLint
      glob:
        - 'src/**/*.ts'
        - 'src/**/*.astro'
        - 'prettier.config.ts'
        - 'panda.config.ts'
        - 'eslint.config.ts'
        - 'astro.config.mts'
        - 'postcss.config.cjs'
        - 'src/**/*.css'
        - 'package.json'
        - 'tsconfig.json'
        - 'wrangler.jsonc'
      run: |
        pnpm eslint {staged_files} --fix --config eslint.config.ts
      stage_fixed: true

    - name: Typecheck with Astro (app)
      glob:
        - 'src/**/*.ts'
        - 'src/**/*.astro'
        - 'astro.config.mts'
        - 'worker-configuration.d.ts'
        - 'package.json'
        - 'pnpm-lock.yaml'
      run: |
        pnpm astro check
